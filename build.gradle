plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = "21"
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.media']
}

def gdxVersion = '1.13.1'

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'

    implementation "com.badlogicgames.gdx:gdx:${gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-freetype:${gdxVersion}"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-desktop"
}

application {
    mainClass = 'alkosmen.app.DesktopStartGame'
}

tasks.register('runGdxMenu', JavaExec) {
    group = 'application'
    description = 'Runs the experimental libGDX main menu.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'alkosmen.gdx.GdxDesktopLauncher'
    workingDir = projectDir
}

def packagingToolchain = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    jvmArgs(
            '-Dfile.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8'
    )
}
tasks.register('packageWindowsExe', Exec) {
    group = 'distribution'
    description = 'Builds a portable self-contained Windows application with an .exe launcher.'
    dependsOn tasks.installDist

    def portableDir = layout.buildDirectory.dir('portable')
    outputs.dir(portableDir)
    outputs.upToDateWhen { false }

    doFirst {
        def jdkHome = packagingToolchain.get().metadata.installationPath.asFile
        def jpackage = new File(jdkHome, 'bin/jpackage.exe')
        if (!jpackage.isFile()) {
            throw new GradleException("jpackage.exe was not found in ${jdkHome}")
        }

        delete(portableDir)
        executable jpackage.absolutePath
        args(
                '--type', 'app-image',
                '--dest', portableDir.get().asFile.absolutePath,
                '--name', 'Alkosmen',
                '--app-version', '0.1.0',
                '--vendor', 'Alkosmen',
                '--description', '2D game',
                '--input', layout.buildDirectory.dir("install/${application.applicationName}/lib").get().asFile.absolutePath,
                '--main-jar', tasks.jar.archiveFileName.get(),
                '--main-class', application.mainClass.get(),
                '--add-modules', 'java.desktop,java.logging,java.management,java.naming,java.rmi,java.sql,jdk.unsupported'
        )
    }
}


tasks.register('runAlkosmenWalk', JavaExec) {
    group = 'application'
    description = 'Runs the Alkosmen walk test.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'alkosmen.gdx.AlkosmenWalkLauncher'
    workingDir = projectDir
}

tasks.register('verifyWalkCycle', JavaExec) {
    group = 'verification'
    description = 'Checks distance-driven walk timing without a graphics context.'
    dependsOn tasks.testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'alkosmen.gdx.render.WalkCycleTest'
    enableAssertions = true
}

tasks.named('check') {
    dependsOn tasks.named('verifyWalkCycle')
}


